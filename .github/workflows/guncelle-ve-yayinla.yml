name: Veriyi güncelle ve yayınla

on:
  schedule:
    - cron: "0 6 6 * *"      # her ayın 6'sı, 09:00 TSİ (TÜFE ayın 3'ünde açıklanır)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install -r requirements.txt shinylive

      - name: EVDS verisini çek
        if: ${{ github.event_name != 'push' }}
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          if [ -z "$EVDS_API_KEY" ]; then
            echo "EVDS_API_KEY sırrı tanımlı değil; mevcut veriyle devam ediliyor."
          else
            python scripts/veri_cek.py
          fi

      - name: Güncel veriyi depoya işle
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/turkiye_aylik.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Veri güncellemesi: $(date +%Y-%m)"
          git push || true

      - name: Testler
        run: python -m pytest -q tests

      - name: Shinylive ile statik site üret
        run: shinylive export app site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
